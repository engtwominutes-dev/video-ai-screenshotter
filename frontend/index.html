<!DOCTYPE html>
<html>
<head>
    <title>Video Screenshot Tool</title>
</head>
<body>
    <h2>Upload Video</h2>

    <form id="uploadForm">
        <input type="file" id="video" required>
        <br><br>

        <label>Screenshots:</label>
        <input type="number" id="count" value="5">
        <br><br>

        <label>Format:</label>
        <select id="format">
            <option value="jpg">JPG</option>
            <option value="png">PNG</option>
        </select>
        <br><br>

        <button type="submit">Upload</button>
    </form>

    <p id="status"></p>

    <script>
        const form = document.getElementById("uploadForm");
        const status = document.getElementById("status");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById("video");
            const count = document.getElementById("count").value;
            const format = document.getElementById("format").value;

            if (!fileInput.files.length) {
                status.innerText = "No file selected";
                return;
            }

            const data = new FormData();
            data.append("file", fileInput.files[0]);
            data.append("screenshot_count", count);
            data.append("image_format", format);

            status.innerText = "Uploading...";

            try {
                const response = await fetch(
                    "https://video-ai-screenshotter-production.up.railway.app//upload",
                    {
                        method: "POST",
                        body: data
                    }
                );

                const result = await response.json();
                status.innerText = result.message;
            } catch (err) {
                status.innerText = "Upload failed";
                console.error(err);
            }
        });
    </script>
</body>
</html>
